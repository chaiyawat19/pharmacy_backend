<!DOCTYPE html>
<html lang="th">
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NestJS + n8n SSE Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
            background-color: #f0f2f5;
        }

        #chat-box {
            border: 1px solid #ddd;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .message {
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
            white-space: pre-wrap;
            /* Handles newlines correctly */
        }

        .bot {
            align-self: flex-start;
            background-color: #e9ecef;
            color: #333;
            border-bottom-left-radius: 2px;
        }

        .user {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }

        .thinking {
            color: #888;
            font-style: italic;
            font-size: 0.9em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot-flashing {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #888;
            color: #888;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0.5s;
        }

        .dot-flashing::before,
        .dot-flashing::after {
            content: '';
            display: inline-block;
            position: absolute;
            top: 0;
        }

        .dot-flashing::before {
            left: -10px;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #888;
            color: #888;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 0s;
        }

        .dot-flashing::after {
            left: 10px;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #888;
            color: #888;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 1s;
        }

        @keyframes dot-flashing {
            0% {
                background-color: #888;
            }

            50%,
            100% {
                background-color: #ebe6ff;
            }
        }
    </style>
</head>

<body>

    <h2 style="text-align: center; color: #333;">NestJS + n8n Chat</h2>

    <div style="margin-bottom: 15px;">
        <label style="font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px;">JWT Token:</label>
        <input type="text" id="tokenInput" placeholder="วาง Access Token ที่นี่..."
            style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
    </div>

    <div id="chat-box"></div>

    <div style="display: flex; gap: 10px;">
        <input type="text" id="msgInput" placeholder="พิมพ์ข้อความ..."
            style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        <button onclick="sendMessage()"
            style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">ส่ง</button>
    </div>

    <script>
        let typeQueue = [];
        let isTyping = false;

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const chatBox = document.getElementById('chat-box');
            const message = input.value;
            const token = document.getElementById('tokenInput').value;

            if (!message || !token) {
                alert("กรุณาใส่ Message และ Token");
                return;
            }

            // 1. แสดงข้อความ User
            addMessage(message, 'user');
            input.value = '';

            // 2. แสดงสถานะ Thinking...
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking';
            thinkingDiv.innerHTML = '<div class="dot-flashing"></div><span style="margin-left: 15px;">Thinking...</span>';
            chatBox.appendChild(thinkingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // เตรียมกล่องข้อความ Bot (ซ่อนไว้ก่อน หรือแสดงแต่ยังไม่มีข้อความ)
            const botMsgDiv = document.createElement('div');
            botMsgDiv.className = 'message bot';
            // ยังไม่เอาเข้า chatBox จนกว่าจะได้ข้อมูลแรก หรือเอาเข้าเลยแต่ว่างไว้
            // เอาเข้าเลยก็ได้จะได้จองที่
            // chatBox.appendChild(botMsgDiv); 

            try {
                const response = await fetch(`${process.env.NEXT_PUBLIC_API_URL}/chat/message`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ userId: 1, message: message })
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();

                // Remove thinking indicator
                if (chatBox.contains(thinkingDiv)) {
                    chatBox.removeChild(thinkingDiv);
                }

                // Show bot message container
                chatBox.appendChild(botMsgDiv);

                // Extract text from n8n response
                // Adjust this based on your actual n8n output structure
                let text = '';
                if (Array.isArray(data) && data.length > 0) {
                    text = data[0].content || data[0].output || JSON.stringify(data);
                } else if (typeof data === 'object') {
                    text = data.content || data.output || JSON.stringify(data);
                } else {
                    text = String(data);
                }

                // Push to type queue
                if (text) {
                    text.split('').forEach(char => typeQueue.push(char));
                    processTypeQueue(botMsgDiv);
                }

            } catch (error) {
                console.error("Error:", error);
                if (chatBox.contains(thinkingDiv)) chatBox.removeChild(thinkingDiv);

                const errDiv = document.createElement('div');
                errDiv.className = 'message bot';
                errDiv.style.color = 'red';
                errDiv.innerText = `Error: ${error.message}`;
                chatBox.appendChild(errDiv);
            }

        }

        function processTypeQueue(element) {
            if (isTyping) return;
            isTyping = true;

            const chatBox = document.getElementById('chat-box');

            function type() {
                if (typeQueue.length > 0) {
                    const char = typeQueue.shift();
                    element.textContent += char; // ใช้ textContent เพื่อความปลอดภัยและรองรับ pre-wrap
                    chatBox.scrollTop = chatBox.scrollHeight;

                    // ปรับความเร็วตรงนี้ (เลขมาก = ช้า)
                    setTimeout(type, 30);
                } else {
                    isTyping = false;
                }
            }
            type();
        }

        function addMessage(text, type) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Allow submitting with Enter key
        document.getElementById('msgInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>

</html>
